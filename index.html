<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>IANO PTCG Bracket Builder</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="app-header">
    <div class="logo-mark" aria-hidden="true"><span class="ball"></span></div>
    <div class="header-text">
      <h1>IANO PTCG Bracket Builder</h1>
      <p class="subtitle">寶可夢卡牌單淘汰賽 · 左右對開樹狀對戰表 · 8 / 16 / 32 強</p>
    </div>
  </header>

  <main class="app-main">
    <section class="controls no-print" id="controls">
      <div class="control-row">
        <label for="sizeSelect">賽事規模</label>
        <select id="sizeSelect" aria-label="選擇賽事規模">
          <option value="8">8強</option>
          <option value="16" selected>16強</option>
          <option value="32">32強</option>
        </select>
      </div>
      <div class="control-row buttons">
        <button type="button" id="btnGenerate" class="btn btn-primary">產生對戰表</button>
        <button type="button" id="btnReset" class="btn btn-danger">重置全部</button>
        <button type="button" id="btnPrint" class="btn btn-secondary">列印</button>
      </div>
      <p class="hint">種子由系統依列自動分配（#1～#N）。左側為種子 1 半區、右側為種子 2 半區，冠軍戰於中央。點「晉級」推進；「清除」或改選會連帶清除後續結果。</p>
    </section>

    <section class="entry-panel no-print" id="entryPanel">
      <h2>選手資料 <span class="h2-sub">（種子自動編號）</span></h2>
      <div id="entryGrid" class="entry-grid"></div>
    </section>

    <section class="bracket-section" id="bracketSection">
      <div class="bracket-toolbar no-print">
        <h2>對戰樹狀圖</h2>
        <span id="bracketStatus" class="status-pill">尚未產生</span>
      </div>
      <div class="bracket-scroll">
        <div id="printScaleWrap" class="print-scale-wrap">
          <div id="bracket" class="bracket-mirror" role="region" aria-label="左右對開淘汰賽對戰表"></div>
        </div>
      </div>
    </section>
  </main>

  <footer class="app-footer no-print">
    <p>IANO PTCG Bracket Builder · 純前端靜態頁面 · 可直接開啟 index.html 或部署至 GitHub Pages</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
